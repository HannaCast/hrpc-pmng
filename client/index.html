<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Personas</title>
    <style>
      body { margin: 24px; background: #fff; color: #1b1b1b; font-family: sans-serif; }
      form { display: flex; gap: 8px; }
      input { padding: 8px; font: inherit; }
      button { padding: 8px 14px; font: inherit; }
      table { margin-top: 16px; border-collapse: collapse; }
      th, td { border: 1px solid #ccc; padding: 8px 14px; text-align: left; }
    </style>
  </head>
  <body>
    <form id="form">
      <input id="nombre" type="text" placeholder="Nombre" />
      <button type="submit">Enviar</button>
    </form>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
        </tr>
      </thead>
      <tbody id="cuerpo"></tbody>
    </table>
    <script src="index.js"></script>
  </body>
</html>
